upstream geekdance_ops_web {
  server web:3000;
  keepalive 32;
}

upstream geekdance_ops_api {
  server api:4000;
  keepalive 16;
}

server {
  listen 8080 default_server;
  server_name aiops.geekdance.cn;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 'ok\n';
  }

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    default_type text/plain;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 8443 ssl default_server;
  http2 on;
  server_name aiops.geekdance.cn;
  client_max_body_size 22m;

  ssl_certificate /etc/letsencrypt/live/aiops.geekdance.cn/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/aiops.geekdance.cn/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;

  add_header Strict-Transport-Security "max-age=86400" always;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  limit_req zone=per_ip burst=40 nodelay;
  limit_conn connections_per_ip 30;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 'ok\n';
  }

  location /_next/static/ {
    proxy_pass http://geekdance_ops_web;
    proxy_cache_valid 200 1h;
    add_header Cache-Control "public, max-age=31536000, immutable";
    # A location-level add_header stops inheritance from the server block.
    # Repeat the security headers wherever a location adds its own headers.
    add_header Strict-Transport-Security "max-age=86400" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }

  location ^~ /api/public/assets/ {
    proxy_pass http://geekdance_ops_api;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Request-ID $request_id;
    proxy_hide_header X-Powered-By;
  }

  location ^~ /api/assets/ {
    proxy_pass http://geekdance_ops_api;
    proxy_request_buffering off;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Request-ID $request_id;
    proxy_hide_header X-Powered-By;
  }

  # Stream reference attachments directly to Fastify. Routing multipart
  # bodies through the Next.js rewrite layer can buffer or reject otherwise
  # valid 20 MiB uploads.
  location ^~ /api/attachments/ {
    proxy_pass http://geekdance_ops_api;
    proxy_request_buffering off;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Request-ID $request_id;
    proxy_hide_header X-Powered-By;
  }

  location ^~ /_internal/public-assets/ {
    internal;
    alias /data/assets/;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Asset-Delivery nginx-sendfile always;
    add_header X-Content-Type-Options nosniff always;
    add_header Strict-Transport-Security "max-age=86400" always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  }

  location ^~ /_internal/private-assets/ {
    internal;
    alias /data/assets/;
    add_header Cache-Control "private, no-store" always;
    add_header X-Asset-Delivery nginx-sendfile always;
    add_header X-Content-Type-Options nosniff always;
    add_header Strict-Transport-Security "max-age=86400" always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  }

  location / {
    proxy_pass http://geekdance_ops_web;
    # Next.js may emit long-lived shared cache headers for prerendered HTML.
    # Keeping those headers at the CDN can serve an old HTML shell after a
    # deployment while its hashed JavaScript chunks already belong to the new
    # release. Static chunks keep their immutable cache policy above; portal
    # documents and RSC responses must always be revalidated at the origin.
    proxy_hide_header Cache-Control;
    add_header Cache-Control "private, no-store" always;
    add_header Strict-Transport-Security "max-age=86400" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_hide_header X-Powered-By;
  }
}
