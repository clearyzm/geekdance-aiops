<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>极客跳动 AI 运营中心｜真实页面公开原型</title>
    <style>
      :root { --red:#d9272e; --ink:#171717; --muted:#737373; --line:#e7e5e4; --canvas:#f5f5f4; }
      * { box-sizing:border-box; }
      body { margin:0; background:var(--canvas); color:var(--ink); font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif; }
      header { position:sticky; top:0; z-index:5; display:flex; justify-content:space-between; gap:20px; padding:18px 28px; border-bottom:1px solid var(--line); background:rgba(255,255,255,.95); backdrop-filter:blur(12px); }
      h1 { margin:0; font-size:20px; } header p { margin:4px 0 0; color:var(--muted); font-size:13px; }
      .badge { align-self:center; padding:7px 11px; border:1px solid #efb1b4; border-radius:999px; color:#a3181d; background:#fff7f7; font-size:12px; }
      main { width:min(1500px,100%); margin:auto; padding:36px 28px 80px; }
      .intro { max-width:820px; margin-bottom:28px; line-height:1.75; color:#555; }
      .grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:20px; }
      figure { margin:0; overflow:hidden; border:1px solid var(--line); border-radius:16px; background:white; box-shadow:0 10px 26px rgba(0,0,0,.04); }
      figure.wide { grid-column:1/-1; } figcaption { padding:14px 18px; border-bottom:1px solid var(--line); font-weight:650; }
      a { display:block; background:#ebeae8; } img { display:block; width:100%; height:auto; }
      .mobile { max-width:390px; margin:auto; }
      footer { margin-top:30px; padding:18px; border-left:4px solid var(--red); background:white; color:#555; line-height:1.7; }
      @media (max-width:820px) { .grid{grid-template-columns:1fr} header{padding:14px 16px}.badge{display:none} main{padding:24px 14px 60px} }
    </style>
  </head>
  <body>
    <header><div><h1>极客跳动 AI 运营中心</h1><p>真实页面公开原型 · 2026-08-18</p></div><div class="badge">已脱敏</div></header>
    <main>
      <p class="intro">页面来自已部署网站。公开版本只展示空表单、加载态和不含真实业务数据的界面，用于说明当前产品的信息架构、品牌语言和响应式布局。</p>
      <div class="grid">
        <figure class="wide"><figcaption>AI 内容生产</figcaption><a href="./images/content-create-desktop.jpg"><img src="./images/content-create-desktop.jpg" alt="AI 内容生产" /></a></figure>
        <figure><figcaption>内容资产空态</figcaption><a href="./images/assets-empty-desktop.jpg"><img src="./images/assets-empty-desktop.jpg" alt="内容资产" /></a></figure>
        <figure><figcaption>图片工坊</figcaption><a href="./images/image-studio-desktop.jpg"><img src="./images/image-studio-desktop.jpg" alt="图片工坊" /></a></figure>
        <figure><figcaption>渠道管理空态</figcaption><a href="./images/channels-empty-desktop.jpg"><img src="./images/channels-empty-desktop.jpg" alt="渠道管理" /></a></figure>
        <figure><figcaption>多账号发布空态</figcaption><a href="./images/distribution-empty-desktop.jpg"><img src="./images/distribution-empty-desktop.jpg" alt="多账号发布" /></a></figure>
        <figure><figcaption>任务回收站加载态</figcaption><a href="./images/trash-empty-desktop.jpg"><img src="./images/trash-empty-desktop.jpg" alt="任务回收站" /></a></figure>
        <figure><figcaption>成员管理加载态</figcaption><a href="./images/members-loading-desktop.jpg"><img src="./images/members-loading-desktop.jpg" alt="成员管理" /></a></figure>
        <figure class="wide"><figcaption>系统设置</figcaption><a href="./images/settings-desktop.jpg"><img src="./images/settings-desktop.jpg" alt="系统设置" /></a></figure>
        <figure class="wide mobile"><figcaption>移动端内容生产</figcaption><a href="./images/content-create-mobile.jpg"><img src="./images/content-create-mobile.jpg" alt="移动端内容生产" /></a></figure>
      </div>
      <footer><strong>隐私边界：</strong>完整生产截图包含真实任务和运行信息，只保存在内部环境；本公开目录不包含这些原图。</footer>
    </main>
  </body>
</html>
