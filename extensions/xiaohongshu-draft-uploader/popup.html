<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>多平台草稿助手</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <p class="eyebrow">GEEKDANCE</p>
      <h1>多平台草稿助手</h1>
      <p class="hint">支持小红书、知乎、今日头条、百家号和 LinkedIn。</p>
      <p class="guard">
        安装后无需填写任何设置。在同一 Chrome
        登录相应创作后台，再从运营中心指定任务保存草稿。
      </p>
      <button id="check" class="secondary">检查助手状态</button>
      <p id="status" role="status"></p>
      <p class="guard">
        小红书填写完后人工暂存；其他平台只在草稿按钮唯一明确时自动保存。遇到验证码或页面变化会立即停止。
      </p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
